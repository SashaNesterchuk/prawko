# Feature: Premium monetization
# Scenario: A dismissed ad does not open the premium bottom sheet or paywall.
appId: com.mindjar.prawko
tags:
  - monetization
  - ads
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: question-result
      PREMIUM_TEASER_MOMENT: after_ad
      TARGET_ID: screen-question-result

- extendedWaitUntil:
    visible:
      id: "screen-question-result"
    timeout: 10000

- waitForAnimationToEnd:
    timeout: 3000

- assertNotVisible:
    id: "premium-teaser"

- assertNotVisible:
    id: "screen-paywall"
