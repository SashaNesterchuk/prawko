# Feature: Premium monetization
# Scenario: After an odd dismissed interstitial (1st, 3rd, 5th, any placement)
# appears; CTA opens the existing paywall.
appId: com.mindjar.prawko
tags:
  - monetization
  - ads
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: question-result
      PREMIUM_TEASER_MOMENT: after_ad
      TARGET_ID: premium-teaser

- extendedWaitUntil:
    visible:
      id: "premium-teaser"
    timeout: 5000

- assertVisible:
    id: "premium-teaser-cta"

- tapOn:
    id: "premium-teaser-cta"

- extendedWaitUntil:
    visible:
      id: "screen-paywall"
    timeout: 10000
