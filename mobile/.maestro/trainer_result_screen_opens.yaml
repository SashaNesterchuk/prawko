# Feature: Training session result
# Scenario: Finished training result → answers review → last question Finish
# returns to the result screen (never a disabled Next on the last answer).
# Native in-app review is suppressed in e2e builds so this screen stays tappable.
appId: com.mindjar.prawko
tags:
  - training
  - result
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: question-result
      TARGET_ID: screen-question-result

- assertVisible:
    id: "screen-question-result"

- assertVisible:
    id: "question-result-primary"

- assertVisible:
    id: "question-result-answers"

- assertVisible:
    id: "question-result-new-attempt"

- assertVisible:
    id: "question-result-topics"

- assertVisible:
    id: "result-topic-progress-row"

- tapOn:
    id: "question-result-answers"

- extendedWaitUntil:
    visible:
      id: "screen-question-answers-review"
    timeout: 10000

- assertVisible:
    id: "screen-question-answers-review"

- assertVisible:
    id: "question-answers-review-next"

# E2E seed is a 5-question finished session (see seedE2EFinishedQuestionSession).
- repeat:
    times: 4
    commands:
      - tapOn:
          id: "question-answers-review-next"
      - waitForAnimationToEnd:
          timeout: 3000

- extendedWaitUntil:
    visible:
      id: "question-answers-review-finish"
    timeout: 10000

- tapOn:
    id: "question-answers-review-finish"

- extendedWaitUntil:
    visible:
      id: "screen-question-result"
    timeout: 10000

- assertVisible:
    id: "screen-question-result"
