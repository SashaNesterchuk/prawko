# Feature: Blitz
# Scenario: Answering then finishing a quick session starts a fresh first question.
appId: com.mindjar.prawko
tags:
  - blitz
  - session
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      PLUS_ACCESS: "true"
      TARGET_ID: screen-home

- tapOn:
    id: "home-tile-blitz"

- extendedWaitUntil:
    visible:
      id: "blitz-duration-dialog"
    timeout: 10000

- tapOn:
    id: "question-count-start"

- extendedWaitUntil:
    visible:
      id: "screen-question"
    timeout: 20000

- assertVisible:
    id: "question-step-0-current"

- runFlow:
    file: subflows/answer_first_available_option.yaml
    env:
      OPTION_ID: question-choice-index-0

- tapOn:
    id: "question-close"

- runFlow:
    file: subflows/confirm_training_exit_to_home.yaml

- tapOn:
    id: "home-tile-blitz"

- extendedWaitUntil:
    visible:
      id: "blitz-duration-dialog"
    timeout: 10000

- tapOn:
    id: "question-count-start"

- extendedWaitUntil:
    visible:
      id: "screen-question"
    timeout: 20000

- assertVisible:
    id: "question-step-0-current"
- assertNotVisible:
    id: "question-step-0-wrong"
- assertNotVisible:
    id: "question-step-0-correct"
- assertNotVisible:
    id: "question-feedback"
