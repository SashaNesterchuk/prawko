# Feature: Trainer
# Scenario: Closing a started session (free user, ads on) returns Home and
# Home stays tappable — the interstitial must not freeze the UI.
appId: com.mindjar.prawko
tags:
  - trainer
  - session
  - ads
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: trainer-modes
      ENABLE_ADS: "true"
      PLUS_ACCESS: "false"
      TARGET_ID: screen-trainer-modes

- tapOn:
    id: "trainer-mode-random"

- runFlow:
    file: subflows/start_default_question_count.yaml
    env:
      TARGET_ID: screen-question

- runFlow:
    file: subflows/answer_first_available_option.yaml
    env:
      OPTION_ID: question-choice-index-0

- tapOn:
    id: "question-close"

- extendedWaitUntil:
    visible:
      id: "training-exit-dialog"
    timeout: 10000

- tapOn:
    id: "training-exit-finish"

- runFlow:
    file: subflows/dismiss_interstitial_if_present.yaml

- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 20000

- tapOn:
    id: "action-tile-trainer"

- extendedWaitUntil:
    visible:
      id: "screen-trainer-modes"
    timeout: 15000
