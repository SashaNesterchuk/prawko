# Feature: Learn personalized training
# Scenario: Smart reviews opens the Figma empty screen when nothing is due
appId: com.mindjar.prawko
tags:
  - learn
  - srs
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: learn
      TARGET_ID: screen-learn

- tapOn:
    id: "learn-tile-srs"

# Fresh onboarded state has no due reviews → Figma smart-review empty screen.
- extendedWaitUntil:
    visible:
      id: "screen-srs-empty"
    timeout: 15000

- assertVisible:
    id: "practice-empty-tile-traps"
- assertVisible:
    id: "practice-empty-tile-mistakes"
- assertNotVisible:
    id: "practice-empty-tile-srs"
- assertNotVisible: "Work on mistakes"
- assertNotVisible: "Робота над помилками"
