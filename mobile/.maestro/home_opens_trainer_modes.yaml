# Feature: Home
# Scenario: User opens Trainer modes from the Learn tile
appId: com.mindjar.prawko
tags:
  - smoke
  - home
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      TARGET_ID: screen-home

- runFlow:
    file: subflows/tap_learn_tile.yaml
    env:
      TILE_ID: action-tile-trainer

- extendedWaitUntil:
    visible:
      id: "screen-trainer-modes"
    timeout: 15000

- assertVisible:
    id: "trainer-mode-random"
- assertVisible:
    id: "trainer-mode-new"
- assertVisible:
    id: "trainer-coverage"
