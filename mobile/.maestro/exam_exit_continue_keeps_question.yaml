# Feature: Exam
# Scenario: After answering Q1, Close → Continue stays on question 2.
appId: com.mindjar.prawko
tags:
  - exam
  - session
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      PLUS_ACCESS: "true"
      TARGET_ID: screen-home

- runFlow:
    file: subflows/start_exam_from_home.yaml
    env:
      TARGET_ID: screen-exam-session

- tapOn:
    id: "question-choice-index-0"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0

- tapOn:
    id: "exam-next-question"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0

- extendedWaitUntil:
    visible:
      id: "exam-session-counter"
      text: "Питання 2 з 32"
    timeout: 15000

- tapOn:
    id: "exam-close"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0

- extendedWaitUntil:
    visible:
      id: "training-exit-dialog"
    timeout: 10000

- tapOn:
    id: "training-exit-continue"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 0

- assertVisible:
    id: "screen-exam-session"

- extendedWaitUntil:
    visible:
      id: "exam-session-counter"
      text: "Питання 2 з 32"
    timeout: 5000
