# Feature: Profile support
# Scenario: Onboarded user sees support (mail) and leave-review (Apple review) rows
appId: com.mindjar.prawko
tags:
  - profile
  - support
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: profile
      TARGET_ID: screen-profile
      LOCALE: ua

- scrollUntilVisible:
    element:
      id: "profile-row-feedback"
    direction: DOWN
    timeout: 8000

- assertVisible:
    id: "profile-row-feedback"

- scrollUntilVisible:
    element:
      id: "profile-row-support"
    direction: DOWN
    timeout: 5000

- assertVisible:
    id: "profile-row-support"
