# Feature: Home readiness assessment
# Scenario: Empty readiness CTA starts untimed initial diagnostic (not exam)
appId: com.mindjar.prawko
tags:
  - smoke
  - home
  - readiness
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      TARGET_ID: screen-home

- assertVisible:
    id: "home-readiness-index"
- assertNotVisible:
    id: "home-readiness-index-week-change"
# The card must resolve from the persisted snapshot, never stay a skeleton.
- assertNotVisible:
    id: "home-readiness-index-loading"

- tapOn:
    id: "home-readiness-index"

- extendedWaitUntil:
    visible:
      id: "screen-question"
    timeout: 20000

- assertVisible:
    id: "question-choice-index-0"

# Must not land in the timed exam simulator.
- assertNotVisible:
    id: "screen-exam-session"
