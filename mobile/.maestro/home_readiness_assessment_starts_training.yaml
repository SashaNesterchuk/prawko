# Feature: Learn readiness assessment
# Scenario: Empty readiness CTA on Learn starts untimed initial diagnostic (not exam)
appId: com.mindjar.prawko
tags:
  - smoke
  - home
  - readiness
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: learn
      TARGET_ID: screen-learn

- assertVisible:
    id: "learn-readiness-index"
- assertNotVisible:
    id: "learn-readiness-index-week-change"
# The card must resolve from the persisted snapshot, never stay a skeleton.
- assertNotVisible:
    id: "learn-readiness-index-loading"
- assertNotVisible:
    id: "home-readiness-index"

- tapOn:
    id: "learn-readiness-index"

- extendedWaitUntil:
    visible:
      id: "screen-question"
    timeout: 20000

- assertVisible:
    id: "question-choice-index-0"
- assertVisible:
    id: "question-title-quick-check"
- assertNotVisible:
    id: "question-title-training"
- assertNotVisible:
    id: "screen-exam-session"
