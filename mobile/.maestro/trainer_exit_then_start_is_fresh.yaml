# Feature: Trainer
# Scenario: Finishing an in-progress session and starting again opens a fresh
# first question — it must not resume at Q2 with Q1 already marked wrong.
appId: com.mindjar.prawko
tags:
  - smoke
  - trainer
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: trainer-modes
      PLUS_ACCESS: "true"
      TARGET_ID: screen-trainer-modes

- tapOn:
    id: "trainer-mode-random"

- runFlow:
    file: subflows/start_default_question_count.yaml
    env:
      TARGET_ID: screen-question

- assertVisible:
    id: "question-step-0-current"

- runFlow:
    file: subflows/answer_first_available_option.yaml
    env:
      OPTION_ID: question-choice-index-0

- tapOn:
    id: "question-close"

- extendedWaitUntil:
    visible:
      id: "training-exit-dialog"
    timeout: 10000

- tapOn:
    id: "training-exit-finish"

- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 20000

- tapOn:
    id: "action-tile-trainer"

- extendedWaitUntil:
    visible:
      id: "screen-trainer-modes"
    timeout: 15000

- tapOn:
    id: "trainer-mode-random"

- runFlow:
    file: subflows/start_default_question_count.yaml
    env:
      TARGET_ID: screen-question

- assertVisible:
    id: "question-step-0-current"
- assertNotVisible:
    id: "question-step-0-wrong"
- assertNotVisible:
    id: "question-step-0-correct"
- assertNotVisible:
    id: "question-feedback"
- assertVisible:
    id: "question-counter"
    text: "1 / 20"
