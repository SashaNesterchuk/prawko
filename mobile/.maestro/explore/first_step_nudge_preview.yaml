# Fresh learner on Home, leave the double bounce running for video inspection:
# two lifts separated by 100 ms, then a 2-second pause.
appId: com.mindjar.prawko
tags:
  - explore
---
- runFlow:
    file: ../subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      QUESTION_SCENARIO: roadmap-progress
      PLUS_ACCESS: "true"
      TARGET_ID: screen-home
- assertVisible:
    id: roadmap-first-step-nudge
