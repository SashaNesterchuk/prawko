# Feature: Home contextual card
# Scenario: Today is the roadmap. The old next-action card is not on this screen.
appId: com.mindjar.prawko
tags:
  - smoke
  - home
  - contextual
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      HOME_CONTEXTUAL: mistakes
      PLUS_ACCESS: "true"
      TARGET_ID: screen-home

- assertVisible:
    id: "screen-home"
- assertVisible:
    id: "home-exam-readiness"
- assertNotVisible:
    id: "home-contextual-card"
- assertNotVisible:
    id: "home-exam-date"
