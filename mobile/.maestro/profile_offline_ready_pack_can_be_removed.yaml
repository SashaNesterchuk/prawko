# Feature: Offline mode
# Scenario: Ready offline pack can be removed from the device
appId: com.mindjar.prawko
tags:
  - offline
  - profile
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: profile
      OFFLINE_PACK_CATEGORY: B
      OFFLINE_PACK_STATUS: ready
      PLUS_ACCESS: "true"
      TARGET_ID: screen-profile

- tapOn:
    id: "profile-row-offline-mode"

- extendedWaitUntil:
    visible:
      id: "screen-offline-mode"
    timeout: 15000

- extendedWaitUntil:
    visible:
      id: "offline-mode-pack-state-ready"
    timeout: 15000

- assertVisible:
    id: "offline-mode-remove-action"

- tapOn:
    id: "offline-mode-remove-action"

- extendedWaitUntil:
    visible:
      id: "offline-mode-pack-state-missing"
    timeout: 15000

- assertVisible:
    id: "offline-mode-pack-state-missing"
- assertNotVisible:
    id: "offline-mode-remove-action"
