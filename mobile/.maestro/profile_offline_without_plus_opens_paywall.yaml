# Feature: Offline mode
# Scenario: Free user tapping Offline mode from Profile opens paywall directly (CZ keeps the classic paywall; PL uses paywall2)
appId: com.mindjar.prawko
tags:
  - offline
  - profile
  - paywall
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: profile
      EXAM_COUNTRY: CZ
      PLUS_ACCESS: "false"
      TARGET_ID: screen-profile

- scrollUntilVisible:
    element:
      id: "profile-row-offline-mode"
    direction: DOWN
    centerElement: true
    timeout: 8000

- tapOn:
    id: "profile-row-offline-mode"

- extendedWaitUntil:
    visible:
      id: "screen-paywall"
    timeout: 15000

- assertVisible:
    id: "screen-paywall"

- assertVisible:
    id: "paywall-comparison-table"

- assertNotVisible:
    id: "screen-offline-mode"
