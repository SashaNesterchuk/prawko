# Feature: Offline mode
# Scenario: Exam starts offline when a ready offline pack exists
appId: com.mindjar.prawko
tags:
  - offline
  - exam
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: practice
      OFFLINE_PACK_CATEGORY: B
      OFFLINE_PACK_STATUS: ready
      PLUS_ACCESS: "true"
      REACHABILITY: "false"
      TARGET_ID: screen-practice

- tapOn:
    id: "practice-card-exam-cta"

- extendedWaitUntil:
    visible:
      id: "screen-exam-session"
    timeout: 20000

- assertVisible:
    id: "screen-exam-session"
