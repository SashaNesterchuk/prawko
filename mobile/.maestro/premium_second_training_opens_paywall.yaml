# Feature: Premium monetization
# Scenario: Second completed training opens the existing paywall directly.
appId: com.mindjar.prawko
tags:
  - monetization
  - training
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: question-result
      TARGET_ID: screen-paywall
      TRAINING_COMPLETED_LIFETIME: "1"

- extendedWaitUntil:
    visible:
      id: "screen-paywall"
    timeout: 10000

- assertNotVisible:
    id: "premium-teaser"
