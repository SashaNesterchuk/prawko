# Feature: Home first start
# Scenario: Without the spotlight, Home tiles stay visible; empty card still starts the assessment
appId: com.mindjar.prawko
tags:
  - smoke
  - home
  - first-start
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      FIRST_START: "true"
      TARGET_ID: screen-home

- assertNotVisible:
    id: "home-start-spotlight"
- assertNotVisible:
    id: "home-start-spotlight-skip"

- assertVisible:
    id: "tab-index"
- assertVisible:
    id: "home-readiness-index"
- assertVisible:
    id: "action-tile-trainer"
- assertVisible:
    id: "home-tile-blitz"
- assertNotVisible:
    id: "home-today-start"

- tapOn:
    id: "home-readiness-index"

- extendedWaitUntil:
    visible:
      id: "screen-question"
    timeout: 20000

- assertVisible:
    id: "question-choice-index-0"
- assertVisible:
    id: "question-title-quick-check"
- assertNotVisible:
    id: "question-title-training"
- assertNotVisible:
    id: "screen-exam-session"
