# Feature: Home
# Scenario: Learn exam tile starts the official simulator with no question-count picker
appId: com.mindjar.prawko
tags:
  - smoke
  - home
  - exam
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      TARGET_ID: screen-home

- runFlow:
    file: subflows/tap_learn_tile.yaml
    env:
      TILE_ID: action-tile-exam

- extendedWaitUntil:
    visible:
      id: "screen-exam-session"
    timeout: 20000

- assertVisible:
    id: "screen-exam-session"
- assertVisible:
    id: "exam-session-counter"
    text: "Питання 1 з 32"
