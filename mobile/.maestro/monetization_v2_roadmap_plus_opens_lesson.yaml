# Feature: Monetization V2
# Scenario: Premium opens a roadmap lesson that was locked
appId: com.mindjar.prawko
tags:
  - monetization
  - monetization-v2
  - roadmap
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      MONETIZATION_V2: "true"
      PLUS_ACCESS: "true"
      TARGET_ID: screen-home

- tapOn:
    id: "roadmap-step-1-0"

- extendedWaitUntil:
    visible:
      id: "screen-question"
    timeout: 20000

- assertNotVisible:
    id: "screen-paywall"
