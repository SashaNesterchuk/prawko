# Feature: Home exam date
# Scenario: A set exam date stays on Profile and reopens the calendar
appId: com.mindjar.prawko
tags:
  - home
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      TARGET_ID: screen-home

- assertVisible:
    id: "screen-home"

- tapOn:
    id: "tab-profile"

- extendedWaitUntil:
    visible:
      id: "screen-profile"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "profile-exam-date-set"
    direction: DOWN
    timeout: 15000

- tapOn:
    id: "profile-exam-date-set"

- extendedWaitUntil:
    visible:
      id: "exam-date-calendar"
    timeout: 10000

- tapOn:
    id: "exam-date-calendar-clear"

- extendedWaitUntil:
    notVisible:
      id: "exam-date-calendar"
    timeout: 10000

- assertVisible:
    id: "profile-exam-date-set"
