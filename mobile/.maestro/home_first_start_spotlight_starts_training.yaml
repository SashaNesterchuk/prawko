# Feature: Home first start
# Scenario: First-start Home (FIRST_START) does not show the spotlight; the empty
# readiness card on Today starts the 10-question untimed assessment
appId: com.mindjar.prawko
tags:
  - smoke
  - home
  - first-start
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      FIRST_START: "true"
      TARGET_ID: screen-home

- assertNotVisible:
    id: "home-start-spotlight"
- assertVisible:
    id: "home-exam-readiness"
- assertNotVisible:
    id: "action-tile-trainer"
- assertNotVisible:
    id: "home-tile-blitz"

- tapOn:
    id: "home-exam-readiness"

- extendedWaitUntil:
    visible:
      id: "screen-question"
    timeout: 20000

- assertVisible:
    id: "question-choice-index-0"
- assertVisible:
    id: "question-title-quick-check"
- assertNotVisible:
    id: "question-title-training"
- assertNotVisible:
    id: "screen-exam-session"
