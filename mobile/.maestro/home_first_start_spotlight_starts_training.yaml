# Feature: Home first start
# Scenario: First-start Home (FIRST_START) does not show the spotlight; the empty
# preparation card on Today stays at zero until the first answer
appId: com.mindjar.prawko
tags:
  - smoke
  - home
  - first-start
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      FIRST_START: "true"
      TARGET_ID: screen-home

- assertNotVisible:
    id: "home-start-spotlight"
- assertVisible:
    id: "home-exam-readiness"
- assertNotVisible:
    id: "action-tile-trainer"
- assertNotVisible:
    id: "home-tile-blitz"

- assertVisible:
    id: "home-exam-readiness-percent"
    text: "0%"
- assertVisible:
    id: "home-exam-readiness-correct"
    text: ".*: 0"
- assertVisible:
    id: "home-exam-readiness-mistakes"
    text: ".*: 0"
- tapOn:
    id: "home-exam-readiness-percent"
- assertVisible:
    id: "screen-statistics"
- assertNotVisible:
    id: "screen-question"
