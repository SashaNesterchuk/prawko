# Feature: Exam
# Scenario: Closing an unanswered exam (miss-click) starts a fresh attempt
# at question 1, not a leftover active session.
appId: com.mindjar.prawko
tags:
  - exam
  - session
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      PLUS_ACCESS: "true"
      TARGET_ID: screen-home

- runFlow:
    file: subflows/start_exam_from_home.yaml
    env:
      TARGET_ID: screen-exam-session

- assertVisible:
    id: "exam-session-counter"
    text: "Питання 1 з 32"

- tapOn:
    id: "exam-close"

- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 20000

- runFlow:
    file: subflows/start_exam_from_home.yaml
    env:
      TARGET_ID: screen-exam-session

- assertVisible:
    id: "exam-session-counter"
    text: "Питання 1 з 32"
- assertNotVisible:
    id: "exam-session-counter"
    text: "Питання 2 з 32"
