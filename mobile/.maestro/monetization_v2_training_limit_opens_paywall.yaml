# Feature: Monetization V2
# Scenario: Starting training with no free questions left opens the paywall.
appId: com.mindjar.prawko
tags:
  - monetization
  - monetization-v2
  - trainer
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: trainer-modes
      FREE_QUESTIONS_EXHAUSTED: "true"
      MONETIZATION_V2: "true"
      PLUS_ACCESS: "false"
      TARGET_ID: screen-trainer-modes

- tapOn:
    id: "trainer-mode-random"

- runFlow:
    file: subflows/start_default_question_count.yaml
    env:
      TARGET_ID: screen-paywall

- assertVisible:
    id: "screen-paywall"
- assertNotVisible:
    id: "screen-question"
