# Feature: Onboarding
# Scenario: New user completes onboarding and lands on Home with first-start spotlight
appId: com.mindjar.prawko
tags:
  - smoke
  - onboarding
---
- runFlow: subflows/complete_onboarding.yaml

- assertVisible:
    id: "screen-home"
- assertVisible:
    id: "tab-index"
- extendedWaitUntil:
    visible:
      id: "home-start-spotlight"
    timeout: 15000
- assertVisible:
    id: "action-tile-trainer"
- assertVisible:
    id: "home-tile-blitz"
