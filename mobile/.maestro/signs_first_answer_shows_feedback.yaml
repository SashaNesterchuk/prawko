# Feature: Signs
# Scenario: Onboarded user answers the first sign test question and sees feedback
# Wrong answers show a red "Зрозуміло" CTA; correct answers keep "Наступне питання"
appId: com.mindjar.prawko
tags:
  - smoke
  - signs
  - feedback
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: signs
      TARGET_ID: screen-signs

- tapOn:
    id: "signs-train-all"

- runFlow:
    file: subflows/start_default_question_count.yaml
    env:
      TARGET_ID: screen-sign-test

- runFlow:
    file: subflows/answer_first_available_option.yaml
    env:
      OPTION_ID: sign-test-option-index-0

- runFlow:
    when:
      visible: "Неправильно"
    commands:
      - assertVisible: "Зрозуміло"
      - assertVisible:
          id: "question-feedback-next"

- runFlow:
    when:
      visible: "Правильно"
    commands:
      - assertVisible: "Наступне питання"
      - assertVisible:
          id: "question-feedback-next"

- tapOn:
    id: "question-feedback-next"

- assertVisible:
    id: "screen-sign-test"
