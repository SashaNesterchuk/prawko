# Feature: Topic training progress
# Scenario: A topic answer covers every catalog topic but remains new in another topic queue
appId: com.mindjar.prawko
tags:
  - trainer
  - topics
  - topic-progress
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: topic
      QUESTION_SCENARIO: topic-progress
      TARGET_ID: screen-trainer-modes
      TOPIC_ID: horizontal_road_markings

- tapOn:
    id: "trainer-mode-topic"

- extendedWaitUntil:
    visible:
      id: "screen-question"
    timeout: 15000

- runFlow:
    file: subflows/answer_first_available_option.yaml
    env:
      OPTION_ID: question-choice-index-0

- tapOn:
    id: "question-feedback-next"

- extendedWaitUntil:
    visible:
      id: "screen-question-result"
    timeout: 10000

- tapOn:
    id: "question-result-primary"

- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 10000

- tapOn:
    id: "tab-learn"

- extendedWaitUntil:
    visible:
      id: "screen-learn"
    timeout: 10000

- assertVisible:
    id: "learn-topic-card-horizontal_road_markings-readiness-100"

- assertVisible:
    id: "learn-topic-card-warning_signs-readiness-100"

- tapOn:
    id: "learn-topic-card-index-1"

- extendedWaitUntil:
    visible:
      id: "screen-trainer-modes"
    timeout: 10000

- tapOn:
    id: "trainer-mode-topic"

- extendedWaitUntil:
    visible:
      id: "screen-question"
    timeout: 10000
