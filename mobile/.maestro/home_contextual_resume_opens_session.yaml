# Feature: Home contextual card
# Scenario: Preparation card reflects daily answers without a resume label
appId: com.mindjar.prawko
tags:
  - home
  - contextual
  - daily
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      HOME_DAILY: in_progress
      PLUS_ACCESS: "true"
      TARGET_ID: screen-home

- assertVisible:
    id: "screen-home"
- assertVisible:
    id: "home-exam-readiness"
- assertNotVisible:
    id: "home-contextual-card"
- assertNotVisible:
    id: "home-contextual-resume"

- assertVisible:
    id: "home-exam-readiness-correct"
- assertVisible:
    id: "home-exam-readiness-mistakes"
- assertNotVisible: "Продовжити:.*"
