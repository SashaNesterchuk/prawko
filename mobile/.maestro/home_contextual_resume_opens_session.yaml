# Feature: Home contextual card
# Scenario: An in-progress daily session does not put the old resume card on Today
appId: com.mindjar.prawko
tags:
  - home
  - contextual
  - daily
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      HOME_DAILY: in_progress
      PLUS_ACCESS: "true"
      TARGET_ID: screen-home

- assertVisible:
    id: "screen-home"
- assertVisible:
    id: "home-exam-readiness"
- assertNotVisible:
    id: "home-contextual-card"
- assertNotVisible:
    id: "home-contextual-resume"
