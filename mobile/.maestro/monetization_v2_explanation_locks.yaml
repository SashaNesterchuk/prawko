# Feature: Monetization V2
# Scenario: Czech free topics still hide the explanation behind Premium.
# Poland free topics are covered by monetization_v2_pl_free_topic_explanation.yaml.
appId: com.mindjar.prawko
tags:
  - monetization
  - monetization-v2
  - trainer
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: trainer-modes
      EXAM_COUNTRY: CZ
      MONETIZATION_V2: "true"
      PLUS_ACCESS: "false"
      TARGET_ID: screen-trainer-modes

- tapOn:
    id: "trainer-mode-random"

- runFlow:
    file: subflows/start_default_question_count.yaml
    env:
      TARGET_ID: screen-question

- runFlow:
    file: subflows/answer_first_available_option.yaml

- assertVisible:
    id: "question-explanation-locked"

- tapOn:
    id: "question-explanation-locked"

- extendedWaitUntil:
    visible:
      id: "screen-paywall"
    timeout: 15000

- assertVisible:
    id: "screen-paywall"
