# Feature: Home exam date
# Scenario: Skipping the exam date shows the Home card; setting a date keeps it
appId: com.mindjar.prawko
tags:
  - home
  - onboarding
---
- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible:
      id: "screen-onboarding-category"
    timeout: 30000

- tapOn:
    id: "onboarding-category-B"
- tapOn:
    id: "onboarding-category-continue"

- extendedWaitUntil:
    visible:
      id: "screen-onboarding-exam-schedule"
    timeout: 15000

- tapOn:
    id: "onboarding-exam-date-skip"

- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 20000

- scrollUntilVisible:
    element:
      id: "home-exam-date"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "home-exam-date"

- extendedWaitUntil:
    visible:
      id: "exam-date-calendar"
    timeout: 10000

- tapOn:
    id: "exam-date-calendar-today"
- tapOn:
    id: "exam-date-calendar-confirm"

- extendedWaitUntil:
    notVisible:
      id: "exam-date-calendar"
    timeout: 10000

- scrollUntilVisible:
    element:
      id: "home-exam-date"
    direction: DOWN
    timeout: 10000

- tapOn:
    id: "tab-profile"
- runFlow:
    when:
      notVisible:
        id: "screen-profile"
    commands:
      - tapOn:
          id: "tab-profile"

- extendedWaitUntil:
    visible:
      id: "screen-profile"
    timeout: 15000

- assertVisible:
    id: "profile-exam-date-set"
