# Feature: Premium monetization
# Scenario: A completed exam renders its result, then opens paywall directly.
appId: com.mindjar.prawko
tags:
  - monetization
  - exam
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: exam-result
      EXAM_SESSION_STATUS: completed
      TARGET_ID: screen-paywall

- extendedWaitUntil:
    visible:
      id: "screen-paywall"
    timeout: 10000

- assertNotVisible:
    id: "premium-teaser"
