# Reusable steps: fresh install → finish onboarding (no notifications step).
appId: com.mindjar.prawko
---
- launchApp:
    clearState: true
    clearKeychain: true

- extendedWaitUntil:
    visible:
      id: "screen-onboarding-category"
    timeout: 30000

- assertNotVisible:
    id: "exam-country-list"

- tapOn:
    id: "onboarding-category-B"
- tapOn:
    id: "onboarding-category-continue"

- extendedWaitUntil:
    visible:
      id: "screen-onboarding-exam-schedule"
    timeout: 15000

- tapOn:
    id: "onboarding-exam-schedule-continue"

- extendedWaitUntil:
    visible:
      id: "screen-home"
    timeout: 20000
