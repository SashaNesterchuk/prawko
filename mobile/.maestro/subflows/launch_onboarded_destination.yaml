# Reusable steps: launch a clean app, seed completed onboarding, and land on
# the requested screen through the e2e bootstrap route.
# Defaults use ${VAR || "..."} so runFlow env overrides are not overwritten.
appId: com.mindjar.prawko
env:
  CATEGORY: ${CATEGORY || "B"}
  DAYS_UNTIL_EXAM: ${DAYS_UNTIL_EXAM || "14"}
  DESTINATION: ${DESTINATION || "home"}
  EXAM_SESSION_CATEGORY: ${EXAM_SESSION_CATEGORY || ""}
  EXAM_SESSION_STATUS: ${EXAM_SESSION_STATUS || ""}
  EXAM_START_ORDER: ${EXAM_START_ORDER || "1"}
  LOCALE: ${LOCALE || "ua"}
  OFFLINE_PACK_CATEGORY: ${OFFLINE_PACK_CATEGORY || ""}
  OFFLINE_PACK_STATUS: ${OFFLINE_PACK_STATUS || ""}
  PLUS_ACCESS: ${PLUS_ACCESS || "false"}
  QUESTION_SCENARIO: ${QUESTION_SCENARIO || ""}
  REACHABILITY: ${REACHABILITY || ""}
  SIGN_CATEGORY_ID: ${SIGN_CATEGORY_ID || "A"}
  TOPIC_ID: ${TOPIC_ID || "road_markings_and_warning_signs"}
  TARGET_ID: ${TARGET_ID || "screen-home"}
---
- launchApp:
    clearState: true
    clearKeychain: true

- openLink:
    link: "prawko://e2e/bootstrap?destination=${DESTINATION}&category=${CATEGORY}&daysUntilExam=${DAYS_UNTIL_EXAM}&locale=${LOCALE}&plusAccess=${PLUS_ACCESS}&questionScenario=${QUESTION_SCENARIO}&reachability=${REACHABILITY}&offlinePackStatus=${OFFLINE_PACK_STATUS}&offlinePackCategory=${OFFLINE_PACK_CATEGORY}&examSessionStatus=${EXAM_SESSION_STATUS}&examSessionCategory=${EXAM_SESSION_CATEGORY}&examStartOrder=${EXAM_START_ORDER}&signCategoryId=${SIGN_CATEGORY_ID}&topicId=${TOPIC_ID}"

- runFlow:
    when:
      visible: "Close Advertisement"
    commands:
      - tapOn: "Close Advertisement"

- extendedWaitUntil:
    visible:
      id: "${TARGET_ID}"
    timeout: 20000
