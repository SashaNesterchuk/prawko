# Reusable steps: Home → Exam tile → pick a mini-test size → session.
appId: com.mindjar.prawko
env:
  COUNT: ${COUNT || "10"}
  TARGET_ID: ${TARGET_ID || "screen-exam-session"}
---
- tapOn:
    id: "action-tile-exam"

- extendedWaitUntil:
    visible:
      id: "question-count-dialog"
    timeout: 10000

- tapOn:
    id: "question-count-option-${COUNT}"

- tapOn:
    id: "question-count-start"

- extendedWaitUntil:
    visible:
      id: "${TARGET_ID}"
    timeout: 20000

- assertVisible:
    id: "${TARGET_ID}"
