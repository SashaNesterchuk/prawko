# Reusable steps: accept the default question count and wait for the practice
# screen to appear.
appId: com.mindjar.prawko
env:
  TARGET_ID: ${TARGET_ID || "screen-question"}
---
- extendedWaitUntil:
    visible:
      id: "question-count-dialog"
    timeout: 10000

- tapOn:
    id: "question-count-start"

- extendedWaitUntil:
    visible:
      id: "${TARGET_ID}"
    timeout: 20000

- assertVisible:
    id: "${TARGET_ID}"
