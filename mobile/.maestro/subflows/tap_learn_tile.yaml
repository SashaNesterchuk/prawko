# From Home (or any tab), open Learn and tap a tile that used to live on Today.
appId: com.mindjar.prawko
env:
  TILE_ID: ${TILE_ID || "action-tile-trainer"}
---
- tapOn:
    id: "tab-learn"

- extendedWaitUntil:
    visible:
      id: "screen-learn"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "${TILE_ID}"
    direction: DOWN
    centerElement: true
    timeout: 20000

- tapOn:
    id: "${TILE_ID}"
