# Today no longer has an exam tile. The official simulator starts from Learn.
appId: com.mindjar.prawko
env:
  TARGET_ID: ${TARGET_ID || "screen-exam-session"}
---
- runFlow:
    file: tap_learn_tile.yaml
    env:
      TILE_ID: action-tile-exam

- extendedWaitUntil:
    visible:
      id: "${TARGET_ID}"
    timeout: 20000

- assertVisible:
    id: "${TARGET_ID}"
