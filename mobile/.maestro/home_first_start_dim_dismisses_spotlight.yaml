# Feature: Home first start
# Scenario: First-start Home does not show the dimmed spotlight overlay; tiles stay tappable
appId: com.mindjar.prawko
tags:
  - smoke
  - home
  - first-start
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      FIRST_START: "true"
      TARGET_ID: screen-home

- assertNotVisible:
    id: "home-start-spotlight"
- assertNotVisible:
    id: "home-start-spotlight-dismiss"

- assertVisible:
    id: "tab-index"
- assertVisible:
    id: "home-readiness-index"
- assertVisible:
    id: "action-tile-trainer"
- assertVisible:
    id: "home-tile-blitz"
