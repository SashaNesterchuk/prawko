# Feature: Trainer
# Scenario: Onboarded user answers the first trainer question and sees feedback
# Wrong answers show a red "Зрозуміло" CTA; correct answers keep "Наступне питання"
appId: com.mindjar.prawko
tags:
  - smoke
  - trainer
  - feedback
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: trainer-modes
      TARGET_ID: screen-trainer-modes

- tapOn:
    id: "trainer-mode-random"

- runFlow:
    file: subflows/start_default_question_count.yaml
    env:
      TARGET_ID: screen-question

- runFlow:
    file: subflows/answer_first_available_option.yaml
    env:
      OPTION_ID: question-choice-index-0

- runFlow:
    when:
      visible: "Неправильно"
    commands:
      - assertVisible: "Зрозуміло"
      - assertNotVisible: "Пояснити мою помилку"
      - assertVisible:
          id: "question-feedback-next"

- runFlow:
    when:
      visible: "Правильно"
    commands:
      - assertVisible: "Наступне питання"
      - assertNotVisible: "Пояснити чому інші хибні?"
      - assertVisible:
          id: "question-feedback-next"

- tapOn:
    id: "question-feedback-next"

- assertVisible:
    id: "screen-question"
