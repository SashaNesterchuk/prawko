# Feature: Trainer
# Scenario: Onboarded user answers the first trainer question and sees feedback
# Wrong answers show a red "Зрозуміло" CTA; correct answers keep "Наступне питання"
# Question, options and explanation scroll as one block while the CTA stays
# pinned over the bottom fade, and sign codes in the explanation render
# tappable sign tiles
appId: com.mindjar.prawko
tags:
  - smoke
  - trainer
  - feedback
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: trainer-modes
      TARGET_ID: screen-trainer-modes

- tapOn:
    id: "trainer-mode-random"

- runFlow:
    file: subflows/start_default_question_count.yaml
    env:
      TARGET_ID: screen-question

- runFlow:
    file: subflows/answer_first_available_option.yaml
    env:
      OPTION_ID: question-choice-index-0

- runFlow:
    when:
      visible: "Неправильно"
    commands:
      - assertVisible: "Зрозуміло"
      - assertNotVisible: "Пояснити мою помилку"
      - assertVisible:
          id: "question-feedback-next"

- runFlow:
    when:
      visible: "Правильно"
    commands:
      - assertVisible: "Наступне питання"
      - assertNotVisible: "Пояснити чому інші хибні?"
      - assertVisible:
          id: "question-feedback-next"

# The panel is part of the scroll content now, so question, options and
# explanation scroll as one block while the CTA stays pinned over the fade.
- scrollUntilVisible:
    element:
      id: "question-feedback"
    direction: DOWN
    timeout: 5000

- assertVisible:
    id: "question-feedback-next"

# Only explanations that name a road sign render the sign strip, and a random
# question is not guaranteed to be one of them.
- runFlow:
    when:
      visible:
        id: "explanation-sign-.*"
    commands:
      - tapOn:
          id: "explanation-sign-.*"
      - assertVisible:
          id: "sign-plate-popup"
      - tapOn:
          point: "50%,8%"
      - assertNotVisible:
          id: "sign-plate-popup"

- scrollUntilVisible:
    element:
      id: "question-prompt"
    direction: UP
    timeout: 5000

- assertVisible:
    id: "question-prompt"

- assertVisible:
    id: "question-feedback-next"

- tapOn:
    id: "question-feedback-next"

- assertVisible:
    id: "screen-question"
