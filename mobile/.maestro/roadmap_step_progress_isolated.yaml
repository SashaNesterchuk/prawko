# Opening step 1 must not let correct answers in step 3 fill it.
appId: com.mindjar.prawko
env:
  EXAM_COUNTRY: ${EXAM_COUNTRY || "PL"}
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: home
      QUESTION_SCENARIO: roadmap-progress
      PLUS_ACCESS: "true"
      TARGET_ID: screen-home
- assertVisible:
    id: roadmap-first-step-nudge
- assertVisible:
    id: roadmap-section-progress-0
    text: "^0%$"
- tapOn:
    id: roadmap-step-0-0
- extendedWaitUntil:
    visible:
      id: screen-question
    timeout: 15000
- tapOn:
    id: question-close
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 15000
- assertVisible:
    id: roadmap-first-step-nudge
- tapOn:
    id: roadmap-step-0-2
- extendedWaitUntil:
    visible:
      id: screen-question
    timeout: 15000
- repeat:
    times: 3
    commands:
      - tapOn:
          id: question-choice-index-0
      - tapOn:
          id: question-feedback-next
- extendedWaitUntil:
    visible:
      id: screen-question-result
    timeout: 15000
- tapOn:
    id: question-result-close
- extendedWaitUntil:
    visible:
      id: screen-home
    timeout: 15000
- assertNotVisible:
    id: roadmap-first-step-nudge
- assertVisible:
    id: roadmap-completed-0-2
- assertNotVisible:
    id: roadmap-completed-0-0
- runFlow:
    file: subflows/assert_roadmap_section_percent.yaml
    env:
      PROGRESS_KIND: complete
- takeScreenshot: roadmap-third-only-completed
- tapOn:
    id: roadmap-step-0-0
- extendedWaitUntil:
    visible:
      id: screen-question
    timeout: 15000
- assertVisible:
    id: question-counter
    text: "1 / 3"
