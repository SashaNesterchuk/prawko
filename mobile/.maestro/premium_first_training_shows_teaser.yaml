# Feature: Premium monetization
# Scenario: First completed training shows the teaser, whose CTA opens paywall.
appId: com.mindjar.prawko
tags:
  - monetization
  - training
---
- runFlow:
    file: subflows/launch_onboarded_destination.yaml
    env:
      DESTINATION: question-result
      TARGET_ID: premium-teaser

- extendedWaitUntil:
    visible:
      id: "premium-teaser"
    timeout: 5000

- assertVisible:
    id: "premium-teaser-cta"

- tapOn:
    id: "premium-teaser-cta"

- extendedWaitUntil:
    visible:
      id: "screen-paywall"
    timeout: 10000
