# Interpretation overlay. Event keys come from mobile/src/analytics/catalog.ts.
# A new meaning is a new interpretation id. Do not edit the meaning of an existing id.
contract_version: 2
catalog_ref: mobile/src/analytics/catalog.ts
keys_ref: docs/analytics/keys.md

time:
  product_timezone: Europe/Warsaw

identity:
  primary_analysis_key: app_user_id
  fallback_analysis_key: distinct_id
  never_analysis_key: [person_id]
  # Share of product rows with an empty primary key at which identity becomes unusable.
  unusable_missing_primary_share: 0.05

lead:
  recommendations_enabled: false
  causal_hypotheses_enabled: false

comparison:
  mix_shift_pp: 10
  confounders:
    - app_version
    - analytics_schema_version
    - exam_country
    - locale
    - platform
    - is_plus
    - auth_mode
  acquisition_mix: asa-installation-v1

concentration:
  top_n: 3
  warning_event_share: 0.4

confidence_ceilings:
  deterministic_fact: high
  descriptive_metric: high
  association: medium
  causal_hypothesis: low

# PostHog lifecycle names. They are not in the product catalog.
sdk_events:
  - Application Installed
  - Application Updated
  - Application Opened
  - Application Became Active
  - Application Backgrounded
  - $set

# Product ship dates. Empty until a person writes one. Do not infer these from a metric move.
changes: []

events:
  app_entry_resolved:
    interpretations:
      - id: scoped_external_signal_received_v1
        when_properties: { entry_observation_version: 1 }
        meaning: A processed external signal with explicit observation ID and current, awaiting or unattributed foreground scope. Receipt is not tap time.
        intent_signal: false
        must_not_be_interpreted_as: [notification_delivery, successful_destination, acquisition_attribution, causal_reminder_effect]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: legacy_entry_reason_observation
        meaning: Launch or foreground entry reason was resolved without versioned destination association.
        intent_signal: false
        must_not_be_interpreted_as: [successful_destination, notification_delivery, acquisition_attribution]
        zero_events_mean: not_observed
        funnel_role: optional

  notification_opened:
    interpretations:
      - id: scoped_os_notification_response_v1
        when_properties: { entry_observation_version: 1 }
        meaning: An OS notification response was observed with explicit cached/live and bound/unattributed scope. Cached responses have no current-visit attribution.
        intent_signal: false
        must_not_be_interpreted_as: [notification_delivery, tap_timestamp, causal_reminder_effect, learning_completion]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: legacy_os_notification_response
        meaning: The OS supplied a notification response; cached last responses can belong to an earlier launch.
        intent_signal: false
        must_not_be_interpreted_as: [notification_delivery, current_visit_source, tap_timestamp, learning_completion]
        zero_events_mean: not_observed
        funnel_role: optional

  external_entry_destination_observed:
    interpretations:
      - id: scoped_foreground_destination_observation_v1
        when_properties: { entry_observation_version: 1 }
        meaning: A route/entity/state was observed in the explicitly bound foreground visit within sixty seconds. Preexisting snapshots are separate from later route/state observations.
        intent_signal: false
        must_not_be_interpreted_as: [dispatcher_success, native_rendering_success, notification_delivery, causal_reminder_effect]
        zero_events_mean: not_observed
        funnel_role: optional

  external_entry_destination_ended:
    interpretations:
      - id: bounded_destination_observation_terminal_v1
        when_properties: { entry_observation_version: 1 }
        meaning: Destination observation ended by horizon, scope termination, observation limit or a censored observer/clock boundary.
        intent_signal: false
        must_not_be_interpreted_as: [routing_failure, product_timeout, notification_delivery]
        zero_events_mean: not_observed
        funnel_role: optional

  external_entry_ended:
    interpretations:
      - id: same_visit_entry_association_terminal_v1
        when_properties: { entry_observation_version: 1 }
        meaning: Same-foreground-visit association ended or was censored. The one-hour horizon is analytics-only.
        intent_signal: false
        must_not_be_interpreted_as: [learning_failure, product_timeout, causal_reminder_effect]
        zero_events_mean: not_observed
        funnel_role: optional

  ad_requested:
    interpretations:
      - id: rewarded_opportunity_observation_v1
        when_properties: { ad_observation_version: 1 }
        meaning: Rewarded opportunity processing reached the existing requested event. Missing configuration can still prevent SDK load.
        intent_signal: false
        must_not_be_interpreted_as: [native_load_invocation, impression, revenue, reward_grant]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: legacy_ad_request_observation
        meaning: An ad request path was observed without the rewarded request/impression contract.
        intent_signal: false
        must_not_be_interpreted_as: [impression, verified_revenue]
        zero_events_mean: not_observed
        funnel_role: optional

  ad_native_request_started:
    interpretations:
      - id: rewarded_sdk_load_invocation_v1
        when_properties: { ad_observation_version: 1 }
        meaning: The existing rewarded SDK load invocation was observed with request and instance scope.
        intent_signal: false
        must_not_be_interpreted_as: [loaded_ad, impression, production_delivery]
        zero_events_mean: not_observed
        funnel_role: optional

  ad_shown:
    interpretations:
      - id: rewarded_fullscreen_opened_v1
        when_properties: { ad_observation_version: 1 }
        meaning: Rewarded fullscreen OPENED was observed, separately from SDK PAID impression evidence.
        intent_signal: false
        must_not_be_interpreted_as: [native_impression_callback, revenue, reward_grant]
        zero_events_mean: not_observed
        funnel_role: optional

  ad_impression_observed:
    interpretations:
      - id: rewarded_paid_impression_evidence_v1
        when_properties: { ad_observation_version: 1 }
        meaning: A valid SDK PAID callback supplied scoped rewarded impression evidence. OPENED is not this evidence.
        intent_signal: false
        must_not_be_interpreted_as: [dedicated_native_impression_callback, settled_money, reward_grant, verified_production_delivery]
        zero_events_mean: not_observed
        funnel_role: optional

  ad_impression_revenue:
    interpretations:
      - id: rewarded_sdk_paid_value_v1
        when_properties: { ad_observation_version: 1 }
        meaning: Client SDK PAID value with currency, precision and duplicate callback sequence. Warehouse keeps currencies separate and quarantines conflicts.
        intent_signal: false
        must_not_be_interpreted_as: [settled_money, store_proceeds, admob_reconciliation, reward_grant]
        zero_events_mean: not_observed
        funnel_role: optional

  ad_reward_earned:
    interpretations:
      - id: rewarded_sdk_earned_callback_v1
        when_properties: { ad_observation_version: 1 }
        meaning: The existing EARNED_REWARD callback was observed. Product reward behavior remains separate and unchanged.
        intent_signal: false
        must_not_be_interpreted_as: [paid_revenue, persisted_exam_credit, new_learning]
        zero_events_mean: not_observed
        funnel_role: optional

  ad_dismissed:
    interpretations:
      - id: rewarded_closed_callback_v1
        when_properties: { ad_observation_version: 1 }
        meaning: The existing rewarded CLOSED callback was observed with whether EARNED_REWARD had been seen.
        intent_signal: false
        must_not_be_interpreted_as: [persisted_exam_credit, settled_money]
        zero_events_mean: not_observed
        funnel_role: optional

  ad_failed:
    interpretations:
      - id: rewarded_disabled_configuration_or_sdk_failure_v1
        when_properties: { ad_observation_version: 1 }
        meaning: Existing failed outcome with normalized policy/configuration/SDK category. Disabled opportunities are not native ad failures.
        intent_signal: false
        must_not_be_interpreted_as: [native_failure_from_disabled_opportunity, reward_grant, negative_revenue]
        zero_events_mean: not_observed
        funnel_role: optional

  ad_observation_failed:
    interpretations:
      - id: optional_rewarded_observer_failure_v1
        when_properties: { ad_observation_version: 1 }
        meaning: Optional PAID listener or payload observation failed without changing the product ad/reward result.
        intent_signal: false
        must_not_be_interpreted_as: [product_ad_failure, reward_revocation, negative_revenue]
        zero_events_mean: not_observed
        funnel_role: optional

  install_observation_resolved:
    interpretations:
      - id: persistent_observation_anchor_v1
        when_properties: { observation_contract_version: 1 }
        meaning: Persistent first-observed metadata resolved. first_observed_at is separate from native installation time; the event can repeat.
        intent_signal: false
        must_not_be_interpreted_as: [new_install, unique_person, acquisition_channel]
        zero_events_mean: not_observed
        funnel_role: optional

  analytics_identity_observed:
    interpretations:
      - id: install_account_link_observation_v1
        when_properties: { identity_link_version: 1 }
        meaning: Event-time install/account link, unlink or switch, with no irreversible SDK alias.
        intent_signal: false
        must_not_be_interpreted_as: [person_merge, entitlement_transfer, successful_authentication]
        zero_events_mean: not_observed
        funnel_role: optional

  onboarding_flow_completed:
    interpretations:
      - id: accepted_local_onboarding_completion
        meaning: The local plan was written and onboarding completion returned successfully.
        intent_signal: false
        must_not_be_interpreted_as: [home_arrival, learning_activation]
        zero_events_mean: not_observed
        funnel_role: optional

  onboarding_home_arrived:
    interpretations:
      - id: foreground_home_after_local_onboarding
        meaning: A foreground Home route was observed after accepted local onboarding with the same persistent attempt ID.
        intent_signal: false
        must_not_be_interpreted_as: [usable_content, learning_activation, notification_delivery]
        zero_events_mean: not_observed
        funnel_role: optional

  Application Installed:
    interpretations:
      - id: sdk_install_marker
        meaning: The PostHog SDK did not find a previous installed-build record.
        intent_signal: false
        must_not_be_interpreted_as: [unique_person, first_human_install]
        zero_events_mean: not_observed
        funnel_role: optional

  first_start_shown:
    interpretations:
      - id: legacy_spotlight
        meaning: Historical Home spotlight on an empty readiness card. The current roadmap UI does not show it.
        intent_signal: false
        must_not_be_interpreted_as: [onboarding_dropoff, activation_dropoff]
        zero_events_mean: feature_not_in_current_ui
        funnel_role: never_required

  home_contextual_shown:
    interpretations:
      - id: legacy_home_card
        meaning: Retention card on the old Home. It is not mounted on the current roadmap Home.
        intent_signal: false
        must_not_be_interpreted_as: [current_home_dropoff]
        zero_events_mean: feature_not_in_current_ui
        funnel_role: never_required

  onboarding_step_completed:
    interpretations:
      - id: first_run_category
        when_properties: { step: category }
        meaning: The learner saved a licence category on the current first-run.
        intent_signal: false
        must_not_be_interpreted_as: []
        zero_events_mean: not_observed
        funnel_role: required_when_in_scope
      - id: first_run_exam_schedule
        when_properties: { step: exam_schedule }
        meaning: The learner saved an exam date, or the 14-day default, on the current first-run.
        intent_signal: false
        must_not_be_interpreted_as: []
        zero_events_mean: not_observed
        funnel_role: required_when_in_scope
      - id: inactive_notifications
        when_properties: { step: notifications }
        meaning: Notification step. It is not part of the current first-run.
        intent_signal: false
        must_not_be_interpreted_as: [onboarding_dropoff]
        zero_events_mean: feature_not_in_current_ui
        funnel_role: never_required
      - id: inactive_minutes
        when_properties: { step: minutes }
        meaning: Daily-minutes step. It is not part of the current first-run.
        intent_signal: false
        must_not_be_interpreted_as: [onboarding_dropoff]
        zero_events_mean: feature_not_in_current_ui
        funnel_role: never_required
      - id: inactive_level
        when_properties: { step: level }
        meaning: Level step. It is not part of the current first-run.
        intent_signal: false
        must_not_be_interpreted_as: [onboarding_dropoff]
        zero_events_mean: feature_not_in_current_ui
        funnel_role: never_required
      - id: inactive_school_code
        when_properties: { step: school_code }
        meaning: School-code step. It is not part of the current first-run.
        intent_signal: false
        must_not_be_interpreted_as: [onboarding_dropoff]
        zero_events_mean: feature_not_in_current_ui
        funnel_role: never_required

  exam_restart_gate_shown:
    interpretations:
      - id: result_new_attempt_modal
        meaning: Modal on the exam result screen, opened from New attempt.
        intent_signal: false
        must_not_be_interpreted_as: [daily_exam_cap, home_exam_block, premium_gate]
        zero_events_mean: not_observed
        funnel_role: never_required

  exam_restart_selected:
    interpretations:
      - id: result_new_attempt_choice
        meaning: Choice on the result-screen New attempt modal. dismiss only closes that modal.
        intent_signal: false
        must_not_be_interpreted_as: [daily_exam_cap, exam_blocked, purchase]
        zero_events_mean: not_observed
        funnel_role: never_required

  premium_gate_viewed:
    interpretations:
      - id: legacy_unscoped_gate
        meaning: A premium gate became visible on a build that does not carry analytics schema 3.
        intent_signal: false
        must_not_be_interpreted_as: [purchase_intent, explain_tap, exam_restart_gate, daily_exam_cap]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: inline_lock_after_answer
        since_schema: 3
        when_properties: { presentation: inline_lock }
        meaning: Automatic inline lock after an answer. Not an Explain tap and not a paywall open.
        intent_signal: false
        must_not_be_interpreted_as: [explain_tap, purchase_intent, paywall_open]
        zero_events_mean: not_observed
        funnel_role: never_required
      - id: limit_or_entry_visible
        since_schema: 3
        meaning: A Monetization V2 limit or premium entry became visible. The view itself is not purchase intent.
        intent_signal: false
        must_not_be_interpreted_as: [purchase_intent, exam_restart_gate, daily_exam_cap]
        zero_events_mean: not_observed
        funnel_role: optional

  premium_gate_action:
    interpretations:
      - id: open_paywall_intent
        when_properties: { action: open_paywall }
        meaning: The learner chose to open the paywall from a premium gate.
        intent_signal: true
        must_not_be_interpreted_as: [purchase, purchase_start]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: other_gate_action
        meaning: A premium-gate choice other than opening the paywall.
        intent_signal: false
        must_not_be_interpreted_as: [purchase_intent, purchase]
        zero_events_mean: not_observed
        funnel_role: optional

  paywall_viewed:
    interpretations:
      - id: plus_screen_visible
        meaning: The Plus screen became visible. offers_count at this instant can still be loading.
        intent_signal: false
        must_not_be_interpreted_as: [purchase, purchase_intent]
        zero_events_mean: not_observed
        funnel_role: required_when_in_scope

  paywall_offer_ready:
    interpretations:
      - id: offer_available
        meaning: A purchasable package is available on this paywall view. Not a purchase.
        intent_signal: false
        must_not_be_interpreted_as: [purchase]
        zero_events_mean: not_observed
        funnel_role: required_when_in_scope

  paywall_trial_eligibility_started:
    interpretations:
      - id: trial_eligibility_helper_invoked_v1
        when_properties: { trial_eligibility_observation_version: 1 }
        meaning: A scoped eligibility helper invocation began. Unsupported or unconfigured paths may never query the SDK.
        intent_signal: false
        must_not_be_interpreted_as: [native_query, displayed_trial, trial_start, purchase]
        zero_events_mean: not_observed
        funnel_role: optional

  paywall_trial_eligibility_resolved:
    interpretations:
      - id: trial_eligibility_product_outcome_v1
        when_properties: { trial_eligibility_observation_version: 1 }
        meaning: A normalized product outcome from an observed request. Unknown and UI filtering do not establish ineligibility; detached outcomes do not prove current display.
        intent_signal: false
        must_not_be_interpreted_as: [displayed_trial, trial_start, paid_conversion, entitlement, native_delivery]
        zero_events_mean: not_observed
        funnel_role: optional

  paywall_trial_eligibility_completed:
    interpretations:
      - id: trial_eligibility_request_terminal_v1
        when_properties: { trial_eligibility_observation_version: 1 }
        meaning: A helper request resolved, failed or skipped its SDK query, retaining request scope and observation timing rather than a checkout outcome.
        intent_signal: false
        must_not_be_interpreted_as: [trial_start, purchase, paid_conversion, displayed_trial, native_delivery]
        zero_events_mean: not_observed
        funnel_role: optional

  paywall_cta_selected:
    interpretations:
      - id: purchase_cta
        when_properties: { action: purchase }
        meaning: The purchase handler was invoked. Not a native store call.
        intent_signal: true
        must_not_be_interpreted_as: [purchase, purchase_start]
        zero_events_mean: not_observed
        funnel_role: required_when_in_scope
      - id: other_cta
        meaning: A paywall handler other than purchase, such as restore.
        intent_signal: false
        must_not_be_interpreted_as: [purchase]
        zero_events_mean: not_observed
        funnel_role: optional

  paywall_package_selected:
    interpretations:
      - id: historical_package_selector
        meaning: Historical package selector. The current paywall does not emit this.
        intent_signal: false
        must_not_be_interpreted_as: [current_paywall_step, funnel_dropoff]
        zero_events_mean: feature_not_in_current_ui
        funnel_role: never_required

  premium_prompt_shown:
    interpretations:
      - id: historical_prompt
        meaning: Historical Premium bottom sheet. It is no longer presented.
        intent_signal: false
        must_not_be_interpreted_as: [current_paywall_step, funnel_dropoff]
        zero_events_mean: feature_not_in_current_ui
        funnel_role: never_required

  purchase_started:
    interpretations:
      - id: native_purchase_call
        meaning: Immediately before the native purchasePackage call.
        intent_signal: true
        must_not_be_interpreted_as: [purchase_succeeded, revenue]
        zero_events_mean: not_observed
        funnel_role: required_when_in_scope

  purchase_succeeded:
    interpretations:
      - id: client_purchase_succeeded
        meaning: The SDK reported a successful purchase and active access. Revenue still needs RevenueCat.
        intent_signal: false
        must_not_be_interpreted_as: [settled_revenue]
        zero_events_mean: not_observed
        funnel_role: required_when_in_scope

  ad_skipped:
    interpretations:
      - id: policy_disabled
        when_properties: { should_show: "no", why: disabled }
        meaning: Policy did not allow an interstitial.
        intent_signal: false
        must_not_be_interpreted_as: [ad_failure, broken_ads]
        zero_events_mean: not_observed
        funnel_role: never_required
      - id: other_skip
        meaning: An interstitial did not show for a reason other than a disabled policy.
        intent_signal: false
        must_not_be_interpreted_as: [policy_disabled]
        zero_events_mean: not_observed
        funnel_role: optional

  training_question_answered:
    interpretations:
      - id: training_answer
        meaning: The learner submitted one training question. Not a finished session.
        intent_signal: false
        must_not_be_interpreted_as: [session_completed, exam_pass]
        zero_events_mean: not_observed
        funnel_role: optional

  exam_question_answered:
    interpretations:
      - id: exam_answer_created_v3
        since_schema: 3
        when_properties: { answer_action: create }
        meaning: A successful submission created one logical exam answer slot. Submission revisions and retries are separate from unique questions.
        intent_signal: false
        must_not_be_interpreted_as: [exam_completed, exam_pass, repeated_learning_after_review]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: exam_answer_updated_v3
        since_schema: 3
        when_properties: { answer_action: update }
        meaning: A successful submission edited an existing logical exam answer slot. This is not another uniquely answered question or a repeated-learning attempt.
        intent_signal: false
        must_not_be_interpreted_as: [new_answered_question, repeated_learning_after_review, exam_completed, exam_pass]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: exam_answer
        meaning: The learner submitted one exam question. Not a finished exam and not a pass.
        intent_signal: false
        must_not_be_interpreted_as: [exam_completed, exam_pass]
        zero_events_mean: not_observed
        funnel_role: optional

  answer_explanation_viewed:
    interpretations:
      - id: rendered_explanation_text_observed_v1
        when_properties: { explanation_display_observation_version: 1, explanation_rendered_state: text }
        meaning: An explanation text value was visible with a declared rendered fingerprint and variant. It is not proof of reading or comprehension.
        intent_signal: false
        must_not_be_interpreted_as: [explain_tap, reading_completed, causal_learning_effect, premium_purchase]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: explanation_surface_observed
        meaning: An explanation surface was observed. Text/source/revision evidence may be absent; do not infer a rendered variant.
        intent_signal: false
        must_not_be_interpreted_as: [reading_completed, causal_learning_effect, premium_purchase]
        zero_events_mean: not_observed
        funnel_role: optional

  training_answers_review_question_viewed:
    interpretations:
      - id: training_review_question_observed
        meaning: A training review position was observed. view_state and was_answered distinguish usable answered content from missing/unanswered positions; display metadata does not prove reading.
        intent_signal: false
        must_not_be_interpreted_as: [new_answer, explanation_read, causal_learning_effect]
        zero_events_mean: not_observed
        funnel_role: optional

  exam_answers_review_question_viewed:
    interpretations:
      - id: exam_review_question_observed
        meaning: An exam review position was observed. view_state and was_answered distinguish usable answered content from missing/unanswered positions; display metadata does not prove reading.
        intent_signal: false
        must_not_be_interpreted_as: [new_answer, explanation_read, causal_learning_effect, actual_exam_outcome]
        zero_events_mean: not_observed
        funnel_role: optional

  training_session_abandoned:
    interpretations:
      - id: training_empty_exit
        when_properties: { answered_count: 0 }
        meaning: Left a training session with zero answers recorded on this event. Not a mid-session drop.
        intent_signal: false
        must_not_be_interpreted_as: [mid_session_drop, session_completed]
        zero_events_mean: not_observed
        funnel_role: never_required
      - id: training_left_after_answers
        meaning: Left an unfinished training session after at least one answer on this event.
        intent_signal: false
        must_not_be_interpreted_as: [session_completed, exam_pass]
        zero_events_mean: not_observed
        funnel_role: optional

  exam_session_ended:
    interpretations:
      - id: exam_empty_exit_legacy
        when_properties: { end_reason: miss_click_empty_exit }
        meaning: Closed the exam before answering. On this build the empty exit is exam_session_ended, not a mid-exam drop.
        intent_signal: false
        must_not_be_interpreted_as: [mid_exam_drop, failed_exam, fatigue]
        zero_events_mean: not_observed
        funnel_role: never_required
      - id: exam_ended_early
        when_properties: { end_reason: user_ended_early }
        meaning: Left the exam after answering some questions, before a normal finish.
        intent_signal: false
        must_not_be_interpreted_as: [exam_completed, fatigue, failed_exam]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: exam_learner_finish
        when_properties: { end_reason: learner_finish }
        meaning: The exam end says the learner finished. This is not an abandonment. Completion still comes from exam_session_completed.
        intent_signal: false
        must_not_be_interpreted_as: [abandonment, failed_exam]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: exam_ended_other
        meaning: The exam session ended for a reason other than empty exit, early exit, or learner finish.
        intent_signal: false
        must_not_be_interpreted_as: [abandonment, failed_exam]
        zero_events_mean: not_observed
        funnel_role: optional

  apple_search_ads_attribution_resolved:
    interpretations:
      - id: ios_installation_adservices_attributed_v1
        when_properties: { platform: ios, asa_result: attributed }
        meaning: An explicit iOS installation AdServices terminal reports attribution. Replay is not another acquisition; resolution may follow a purchase on the same installation identity. Numeric source IDs can be unavailable.
        intent_signal: false
        must_not_be_interpreted_as: [visit_entry, physical_install_date, spend, verified_money, causal_channel_lift, missing_is_organic]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: ios_installation_adservices_organic_v1
        when_properties: { platform: ios, asa_result: organic }
        meaning: An explicit iOS installation AdServices terminal reports attribution false. This does not classify missing checks, Android or unavailable results as organic.
        intent_signal: false
        must_not_be_interpreted_as: [visit_entry, physical_install_date, spend, verified_money, android_organic, missing_is_organic]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: ios_installation_adservices_unavailable_v1
        when_properties: { platform: ios, asa_result: unavailable }
        meaning: An explicit iOS installation check reached unavailable. Its reason is diagnostic, not an organic source or delivery guarantee.
        intent_signal: false
        must_not_be_interpreted_as: [organic_install, paid_install, native_delivery]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: asa_attributed_install
        when_properties: { asa_result: attributed }
        meaning: Apple Search Ads click or impression led to this iOS install. Campaign, ad group, and keyword are numeric ids. Names and spend are not on the event.
        intent_signal: false
        must_not_be_interpreted_as: [visit_entry, keyword_text, campaign_name, ad_spend, roas, unique_person]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: asa_organic_install_check
        when_properties: { asa_result: organic }
        meaning: Apple returned attribution false for this iOS install. The check completed. This is not Android and not a missing event.
        intent_signal: false
        must_not_be_interpreted_as: [visit_entry, paid_install, ad_spend]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: asa_check_unavailable
        when_properties: { asa_result: unavailable }
        meaning: The iOS install check did not get a usable Apple response. Do not read it as organic.
        intent_signal: false
        must_not_be_interpreted_as: [organic_install, paid_install]
        zero_events_mean: not_observed
        funnel_role: optional
      - id: asa_check_other
        meaning: The attribution event has an unrecognized asa_result.
        intent_signal: false
        must_not_be_interpreted_as: [paid_install, organic_install]
        zero_events_mean: not_observed
        funnel_role: optional

funnels:
  - id: paywall_purchase
    grain: paywall_view_id
    slice_by: [app_version, analytics_schema_version]
    conversion_window_seconds: 86400
    steps:
      - event: paywall_viewed
      - event: paywall_offer_ready
        join: paywall_view_id
      - event: paywall_cta_selected
        when_properties: { action: purchase }
      - event: purchase_started
        join: paywall_view_id
      - event: purchase_succeeded
        join: purchase_attempt_id
    never_required_steps:
      - paywall_package_selected
      - premium_prompt_shown

  - id: exam_attempt
    grain: exam_session_id
    slice_by: [app_version, analytics_schema_version]
    steps:
      - event: exam_session_completed
    never_required_steps:
      - exam_restart_gate_shown
      - exam_restart_selected

metrics:
  - id: paywall_purchase_conversion
    evidence_class: descriptive_metric
    funnel: paywall_purchase
    numerator_event: purchase_succeeded
    denominator_event: paywall_viewed
    count: analysis_keys
    conversion_window_seconds: 3600
    definition: >
      Install-level conversion through ordered paywall view, offer ready, purchase CTA,
      native start and success, linked by view and attempt, within one hour.
      Only views with a fully observed one-hour horizon enter the denominator.
      This client outcome is not verified revenue.
    homogeneity: [app_version, analytics_schema_version]
    eligibility:
      min_denominator: 30
      require_homogeneous_slice: true
      maturity: null

  - id: exam_pass_rate
    evidence_class: descriptive_metric
    grain: exam_session_id
    numerator_event: exam_session_completed
    numerator_where: { passed: true }
    denominator_event: exam_session_completed
    count: grain
    homogeneity: [app_version, analytics_schema_version]
    eligibility:
      min_denominator: 30
      require_homogeneous_slice: true
      maturity: null

  - id: d7_return
    evidence_class: descriptive_metric
    definition: >
      Share of analysis keys with Application Installed on Warsaw day D
      that have any product event on Warsaw day D+7.
      Application Installed is not a proven person.
    cohort_event: Application Installed
    maturity: { kind: calendar_day, n: 7 }
    count: analysis_keys
    homogeneity: [app_version, analytics_schema_version]
    eligibility:
      min_denominator: 30
      require_homogeneous_slice: true
      maturity: { kind: calendar_day, n: 7 }

  - id: learning_d7_return
    evidence_class: descriptive_metric
    definition: >
      Share of durable installation observations first observed on Warsaw day D
      with a learning-v1 outcome on day D+7. A learning-v1 outcome is a completed
      training with at least five distinct accepted questions, or a completed
      exam with every target question answered. This is not paid retention.
    cohort_event: install_observation_resolved
    cohort_timestamp_property: first_observed_at
    return_rule: learning-v1
    grain: installation_observation_id
    count: grain
    homogeneity: []
    maturity: { kind: calendar_day, n: 7 }
    eligibility:
      min_denominator: 30
      maturity: { kind: calendar_day, n: 7 }

error_signatures:
  - id: guest_answer_sync_denied
    event: learning_operation_failed
    match:
      operation: sync_answer
      error_code: "42501"
      user_visible: false
    evidence_class: deterministic_fact

qa_rules:
  - id: primary_key_unusable
    severity: FATAL
    effect: block_report
  - id: identity_degraded
    severity: WARNING
    effect: exclude_keys_without_primary_id
  - id: cohort_not_mature
    severity: BLOCKS_METRIC
    effect: prohibit_metric
  - id: event_concentration
    severity: WARNING
    effect: limit_aggregate_metrics
  - id: ambiguous_interpretation
    severity: BLOCKS_METRIC
    effect: prohibit_metric
  - id: acquisition_unavailable
    severity: INFO
    effect: none
