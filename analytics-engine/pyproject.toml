[project]
name = "prawko-analytics"
version = "0.1.0"
description = "Deterministic Prawko analytics engine. The LLM layer is not part of this package."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
prawko-analytics = "prawko_analytics.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prawko_analytics*"]
